# Proves automàtiques a cada push i pull request.
# No executa "npm run build": així, si dist/Replica.gs no està al dia amb
# src/, la prova "dist/Replica.gs està al dia" falla i el commit surt en vermell.
name: Proves

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  proves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
